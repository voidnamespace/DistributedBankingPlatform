syntax = "proto3";

option csharp_namespace = "AuthService.Infrastructure.Grpc.AccountService.Contracts";

package user_lifecycle;

service UserLifecycleValidation {
	rpc ValidateUserDeletion (ValidateUserDeletionGrpcRequest) returns (ValidateUserDeletionGrpcResponse);
}

message ValidateUserDeletionGrpcRequest {
	string user_id = 1;
}

message ValidateUserDeletionGrpcResponse {
	bool is_allowed = 1;
}
